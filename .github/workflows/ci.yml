name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate and build LuCI packages
        uses: ./.github/actions/validate
        with:
          version: "0.1.0"
          out-dir: dist

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: luci-app-oxidns-packages
          path: dist/*
